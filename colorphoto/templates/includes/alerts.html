{% if messages %}

    {% for message in messages %}
    <div id="messages" class="container">
    <div{% if message.tags %} class="alert alert-{{ message.tags }} auto-dismiss-message"{% endif %} role="alert" data-autohide="5000">
        <button type="button" class="close" data-dismiss="alert"><span aria-hidden="true">&times;</span></button>
        {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}Error: {% endif %}
        {{ message }}
    </div>
    </div>
    {% endfor %}

{% endif %}

<script>
  setTimeout(function () {
    document.querySelectorAll('.auto-dismiss-message').forEach(function (el) {
      if (el && el.classList.contains('show')) {
        el.classList.remove('show');
      }
      if (el && el.parentElement) {
        setTimeout(function () {
          el.parentElement.remove();
        }, 300);
      }
    });
  }, 5000);
</script>
