
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ album.title }}</title>

 <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (agar navbar me use kiye hain) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#111;
    font-family:Arial,sans-serif;
    color:#fff;
    overflow-x:hidden;
}

.header{
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    text-align: center;
    width: 100%;
    pointer-events: none;
}

.header h2{
    margin: 0;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
}

.copyright{
    width: 100%;
    text-align: right;
}

.viewer{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:3000px;
}

/* Album 12×36 */
.book{
    width:min(95vw,1400px);
    aspect-ratio:3/1;
    position:relative;
}

.spread{
    position:absolute;
    inset:0;
    transition:opacity .3s;
}

/* Left & Right 12×18 */
.page-half{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    overflow:hidden;
}

.left{left:0;}

.right{
    right:0;
    transform-origin:left center;
    transform-style:preserve-3d;
}

/* Flip animations */
.right.flip-next{
    animation:flipNext .9s ease forwards;
}

.right.flip-prev{
    animation:flipPrev .9s ease forwards;
}

@keyframes flipNext{
    from{transform:rotateY(0deg);}
    to{transform:rotateY(-180deg);}
}

@keyframes flipPrev{
    from{transform:rotateY(-180deg);}
    to{transform:rotateY(0deg);}
}

.page-half img{
    position:absolute;
    top:0;
    width:200%;
    height:100%;
    object-fit:cover;
}

.left img{left:0;}
.right img{left:-100%;}

/* Center Fold */
.fold{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:30px;
    height:100%;
    pointer-events:none;
    z-index:20;
    background:linear-gradient(to right,
        rgba(0,0,0,.55),
        rgba(255,255,255,.08),
        rgba(0,0,0,.55));
    box-shadow:
        inset -4px 0 8px rgba(255,255,255,.08),
        inset 4px 0 10px rgba(0,0,0,.45);
}

.shadow{
    position:absolute;
    inset:0;
    border-radius:14px;
    box-shadow:0 30px 60px rgba(0,0,0,.6);
    pointer-events:none;
}

.controls{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
}

button{
    background:#d4a017;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.counter{
    position:fixed;
    bottom:75px;
    left:50%;
    transform:translateX(-50%);
    font-size:18px;
}

@media(max-width:768px){
    .book{
        width:98vw;
    }
}
</style>
</head>
<body>
    {% include 'includes/navbar.html' %}

<div class="header">
    <h2 >{{ album.title }}</h2>
    <!-- <a href="{% url 'album_list' %}">Back</a> -->
</div>

<div class="viewer">
<div class="book" id="book">

    <!-- Hidden spread underneath -->
    <div class="spread" id="nextSpread" style="opacity:0;">
        <div class="page-half left">
            <img id="nextLeft" loading="lazy" decoding="async" width="1200" height="400">
        </div>
        <div class="page-half right">
            <img id="nextRight" loading="lazy" decoding="async" width="1200" height="400">
        </div>
    </div>

    <!-- Current spread -->
    <div class="spread" id="currentSpread">
        <div class="page-half left">
            <img id="currLeft" loading="eager" fetchpriority="high" decoding="async" width="1200" height="400">
        </div>

        <div class="page-half right" id="flipPage">
            <img id="currRight" loading="eager" fetchpriority="high" decoding="async" width="1200" height="400">
        </div>
    </div>

    <div class="fold"></div>
    <div class="shadow"></div>

</div>
</div>

<div class="counter" id="counter"></div>

<div class="controls">
    <button onclick="prev()">⬅ Previous</button>
    <button onclick="next()">Next ➡</button>
</div>

<audio id="flipAudio" preload="auto">
    <source src="{% static 'music/filip.mp3' %}" type="audio/mpeg">
</audio>
  <div class="copyright">
      <small>© 2026 BR 22 Films. All rights reserved.</small>
    </div>
<!-- This template is standalone, so load the Bootstrap bundle required by the navbar toggle. -->
<script src="{% static 'js/jquery-2.0.0.min.js' %}" defer></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}" defer></script>

<script>

/* Django Images */
const pages=[
{% for page in pages %}
"{{ page.image.url }}"{% if not forloop.last %},{% endif %}
{% endfor %}
];

let index=0;
let busy=false;

const currLeft=document.getElementById("currLeft");
const currRight=document.getElementById("currRight");
const nextLeft=document.getElementById("nextLeft");
const nextRight=document.getElementById("nextRight");
const flipPage=document.getElementById("flipPage");
const nextSpread=document.getElementById("nextSpread");
const audio=document.getElementById("flipAudio");
const counter=document.getElementById("counter");
const book=document.getElementById("book");

function setCurrent(i){
    currLeft.src=pages[i];
    currRight.src=pages[i];
    counter.textContent=`Spread ${i+1} / ${pages.length}`;
}

setCurrent(0);

function playSound(){
    audio.currentTime=0;
    audio.play().catch(()=>{});
}

/* Next */
function next(){

    if(busy || index>=pages.length-1) return;

    busy=true;

    nextLeft.src=pages[index+1];
    nextRight.src=pages[index+1];

    nextSpread.style.opacity=1;

    playSound();

    flipPage.classList.remove("flip-prev");
    flipPage.classList.add("flip-next");

    setTimeout(()=>{

        index++;
        setCurrent(index);

        flipPage.classList.remove("flip-next");
        flipPage.style.animation="none";
        flipPage.offsetHeight;
        flipPage.style.animation="";

        nextSpread.style.opacity=0;
        busy=false;

    },900);
}

/* Previous */
function prev(){

    if(busy || index<=0) return;

    busy=true;

    nextLeft.src=pages[index-1];
    nextRight.src=pages[index-1];

    nextSpread.style.opacity=1;

    playSound();

    flipPage.classList.remove("flip-next");
    flipPage.classList.add("flip-prev");

    setTimeout(()=>{

        index--;
        setCurrent(index);

        flipPage.classList.remove("flip-prev");
        flipPage.style.animation="none";
        flipPage.offsetHeight;
        flipPage.style.animation="";

        nextSpread.style.opacity=0;
        busy=false;

    },900);
}

/* Click Left / Right */
book.addEventListener("click",e=>{

    const x=e.clientX-book.getBoundingClientRect().left;

    if(x>book.clientWidth/2){
        next();
    }else{
        prev();
    }

});

/* Mobile Swipe */
let startX=0;

book.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
});

book.addEventListener("touchend",e=>{

    const end=e.changedTouches[0].clientX;

    if(startX-end>40) next();
    if(end-startX>40) prev();

});

</script>

</body>
</html>
