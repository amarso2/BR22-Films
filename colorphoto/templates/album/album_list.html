{% extends 'base.html' %}
{% load static %}
{% block content %}


<style>

body{
margin:0;
font-family:Arial;
background:#010101;
}

header{
background:#111;
color:white;
padding:25px;
text-align:center;
}

.grid{
width:90%;
margin:30px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:rgb(13, 13, 13);
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:18px;
}

.btn{
display:block;
text-align:center;
background:#d4a017;
color:white;
padding:12px;
border-radius:6px;
text-decoration:none;
margin-top:12px;
}

</style>

</head>

<body>

<header>
    <br>
<h1>My Albums</h1>
</header>

<div class="grid">

{% for album in albums %}

<div class="card">

{% with cover=album.pages.first %}
{% if cover %}
<img src="{{ cover.image.url }}">
{% endif %}
{% endwith %}

<div class="info">

<h3>{{ album.title }}</h3>

<p>{{ album.days_left }} Days Left</p>

<a href="{% url 'album_detail' album.id %}" class="btn">
Open Album
</a>

</div>

</div>

{% empty %}

<h3>No Albums Found</h3>

{% endfor %}

</div>

{% endblock %}
