{% extends 'base.html' %}
{% load static %}

{% block content %}


  <section class="container" style="padding: 6rem 0 4rem;">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="glass-panel p-5">
          {% include 'includes/alerts.html' %}
          <h2 class="mb-4">Welcome Back</h2>
          <p class="text-muted">Login to manage your bookings, view packages, and contact your photography concierge.</p>
          <form action="{% url 'accounts:login' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group mt-4"><label>Email Address</label><input type="email" class="form-control" placeholder="name@example.com" name="email"></div>
            <div class="form-group"><label>Password</label><input type="password" class="form-control" placeholder="••••••••" name="password"></div>
            <div class="d-flex justify-content-between align-items-center mb-4"><a href="{% url 'accounts:forgot_password' %}" class="text-muted">Forgot password?</a></div>
            <button type="submit" class="btn btn-gold btn-block">Login</button>
          </form>
          <p class="text-center text-muted mt-4">New to BR 22 films? <a href="{% url 'accounts:register' %}" class="text-gold">Create account</a></p>
        </div>
      </div>
    </div>
  </section>

{% endblock %}
